<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un projet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="../../assets/css/styles_admin.css">
    <shortcut icon="../../assets/images/logo.png" type="image/x-icon">
</head>
<body>
    <header>
        </header>
    <main>
        <div class="container">
            <h1 class="text-center mt-4">Créer un projet</h1>
            <form id="formNewProjet" class="row mt-5">
                <div class="col-md-6 mb-3">
                    <label for="projectName" class="form-label">Nom du projet</label>
                    <input type="text" class="form-control" id="projectName" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="projectDescription" class="form-label">Description du projet</label>
                    <textarea class="form-control" id="projectDescription" rows="3" required></textarea>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="projectDeadline" class="form-label">Date limite</label>
                    <input type="date" class="form-control" id="projectDeadline" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="projectChef" class="form-label">Chef de projet</label>
                    <select class="form-select" id="projectChef" required>
                        <option value="">Sélectionner un chef de projet</option>
                        <option value="Allan">Allan</option>
                        <option value="David">David</option>
                        <option value="Salym">Salym</option>
                        <option value="Rym  ">Rym  </option>
                    </select>
                </div>
                <div class="col-12 d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">Créer</button>
                </div>
            </form>
        </div>
    </main>
    <footer>
      <h2 class="p_conf"><a href="../../pages/politique_de_conf.html">Politique de Confidentialité</a></h2>
      <h2><a href="../../pages/Faq.html">Faq</a></h2>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/dossier_js_admin/script_creation_projet.js"></script>
</body>
</html>
