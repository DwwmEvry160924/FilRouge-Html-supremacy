<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un projet</title>
    <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Space+Grotesk:wght@300..700&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/chefdeprojet.css">
    <link rel="shortcut icon" href="../../assets/images/logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <nav>
            <!-- partie gauche-->
            <div class="navbar-gauche">
                <a href="../../pages/index.html"><img href="../../pages/index.html" src="../../assets/images/logo.png" alt="" style="height: 80px;"></a>
                <ul class="navbar" style="list-style-type: none; margin: 0;">
                    <li><a href="projet_chef_projet.html">Projets</a></li>
                    <li><a href="tache_chef_projet.html">Tâches</a></li>
                </ul>
            </div>
            <!-- partie droite-->
            <ul class="navbar-droite" style="list-style-type: none; margin-bottom: 0; margin-top: 0;">
                <li><button type="button" onclick="popupNotif()" style="background-color: unset; border: unset; cursor: pointer;"><i  class="bi bi-bell" style="font-size: 25px;"></i></button></li>
                <li><a href="../../pages/profil.html"><i class="bi bi-person-circle" style="font-size: 25px;"></i></a></li>
            </ul>
        </nav>
    </header>
    <main >
        <div style="height: 100vh;" class="container  d-flex flex-column justify-content-center align-items-center">
            <h1 class="text-center mt-4">Créer un projet</h1>
            <form id="formNewProjet" class="row mt-5">
                <div class="col-md-6 mb-3">
                    <label for="projectName" class="form-label">Nom du projet</label>
                    <input type="text" class="form-control" id="projectName" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="projectDescription" class="form-label">Description du projet</label>
                    <textarea class="form-control" id="projectDescription" rows="3" required></textarea>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="projectDebut" class="form-label">Date de debut</label>
                    <input type="time" class="form-control" id="projectDebut" required>
                    <label for="projectDeadline" class="form-label">Date limite</label>
                    <input type="datetime-local" class="form-control" id="projectDeadline" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="projectChef" class="form-label">Chef de projet</label>
                    <select class="form-select" id="projectChef" required>
                        <option value="">Sélectionner un chef de projet</option>
                        <option value="Allan">Allan</option>
                        <option value="David">David</option>
                        <option value="Salym">Salym</option>
                        <option value="Rym  ">Rym  </option>
                    </select>
                </div>
                <div class="col-12 d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">Créer</button>
                </div>
            </form>
        </div>
    </main>
    <footer>
      <h2 class="p_conf"><a href="../../pages/politique_de_conf.html">Politique de Confidentialité</a></h2>
      <h2><a href="../../pages/Faq.html">Faq</a></h2>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/script_chefdeprojet_form.js"></script>
</body>
</html>
